<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laugh Factory 🔥</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 50%, #e63946 100%);
        }

        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .bg-shapes .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
        }

        .bg-shapes .shape:nth-child(1) { width: 400px; height: 400px; top: -100px; left: -100px; }
        .bg-shapes .shape:nth-child(2) { width: 300px; height: 300px; bottom: 10%; right: -50px; }
        .bg-shapes .shape:nth-child(3) { width: 200px; height: 200px; bottom: 30%; left: 20%; }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header { text-align: center; margin-bottom: 40px; }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            color: white;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            margin-bottom: 10px;
        }

        .subtitle { color: rgba(255, 255, 255, 0.9); font-size: 1.1rem; }

        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .btn-glass {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .btn-glass.active {
            background: rgba(255, 255, 255, 0.45);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
        }

        .joke-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            max-width: 700px;
            margin: 0 auto 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .joke-text {
            font-size: 1.4rem;
            color: white;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .punchline {
            font-size: 1.6rem;
            color: #ffeaa7;
            font-weight: 700;
            line-height: 1.4;
        }

        .meme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .meme-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
            position: relative;
        }

        .meme-card:hover { transform: translateY(-5px) scale(1.02); }

        .meme-media {
            position: relative;
            width: 100%;
            height: 300px;
            overflow: hidden;
        }

        .meme-media img, .meme-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .meme-info {
            padding: 15px;
            color: white;
        }

        .meme-title {
            font-size: 0.9rem;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .download-btn {
            background: linear-gradient(135deg, #ff6b35, #e63946);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            justify-content: center;
        }

        .download-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 20px rgba(230, 57, 70, 0.5);
        }

        .hidden { display: none !important; }

        .laughing {
            font-size: 4rem;
            animation: bounce 0.5s ease infinite alternate;
        }

        @keyframes bounce {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .loader {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            gap: 10px;
        }

        .loader span {
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            animation: dot-bounce 1.4s ease-in-out infinite;
        }

        .loader span:nth-child(1) { animation-delay: 0s; }
        .loader span:nth-child(2) { animation-delay: 0.2s; }
        .loader span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dot-bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        .joke-type-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.25);
            color: white;
            padding: 5px 14px;
            border-radius: 15px;
            font-size: 0.75rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .share-btn {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .share-btn:hover { background: rgba(255, 255, 255, 0.35); transform: scale(1.05); }

        .section-title {
            color: white;
            font-size: 1.5rem;
            text-align: center;
            margin: 20px 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 0.95rem;
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { bottom: -50px; opacity: 0; }
            to { bottom: 30px; opacity: 1; }
        }
    </style>
</head>

            { url: "https://media.giphy.com/media/3o6Zt6KHxJTbXCnSvu/giphy.gif", name: "Eye Roll Clip", type: "clip" },
            { url: "https://media.giphy.com/media/3oEjI9LM4oL73TCo6U/giphy.gif", name: "Cat Clip", type: "clip" },
            { url: "https://media.giphy.com/media/VbnWQ4FLX4C7O/giphy.gif", name: "Dog Clip", type: "clip" },
            { url: "https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif", name: "Fail Clip", type: "clip" },
            { url: "https://media.giphy.com/media/lMepHT2zLfY2fS/giphy.gif", name: "Epic Clip", type: "clip" },
            { url: "https://media.giphy.com/media/3o7TKzeN7F1DlkvfLG/giphy.gif", name: "Celebration Clip", type: "clip" },
            { url: "https://media.giphy.com/media/l3q2K5D8YvOgYjWFO/giphy.gif", name: "Shocked Clip", type: "clip" },
            { url: "https://media.giphy.com/media/3o6oBvCdM8xUkEpvPq/giphy.gif", name: "WTF Clip", type: "clip" },
            { url: "https://media.giphy.com/media/l0MYJnJQ4EiYLxvQ4/giphy.gif", name: "Dance Clip", type: "clip" },
            { url: "https://media.giphy.com/media/3o7btNDQfY1u3VuwR2/giphy.gif", name: "Win Clip", type: "clip" },
            { url: "https://media.giphy.com/media/3oz8xSZQaFCJ2fCVnK/giphy.gif", name: "Fail Comp Clip", type: "clip" }
        ];

        // Extra GIF sources for unlimited content
        const extraGifSources = [
            'https://api.giphy.com/v1/gifs/trending?api_key=dc6zaTOxFJmzC&limit=50&rating=g',
            'https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=funny&limit=50&rating=g',
            'https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=memes&limit=50&rating=g',
            'https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=lol&limit=50&rating=g',
            'https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=wow&limit=50&rating=g',
            'https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=laugh&limit=50&rating=g',
            'https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=comedy&limit=50&rating=g',
            'https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=hilarious&limit=50&rating=g',
            'https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=fail&limit=50&rating=g',
            'https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=epic&limit=50&rating=g'
        ];

        // Extra clip sources for unlimited content
        const extraClipSources = [
            'https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=reactions&limit=50&rating=g',
            'https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=funny%20reactions&limit=50&rating=g',
            'https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=epic%20fail&limit=50&rating=g',
            'https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=yes&limit=50&rating=g',
            'https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=no&limit=50&rating=g',
            'https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=wow&limit=50&rating=g',
            'https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=omg&limit=50&rating=g',
            'https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=lol&limit=50&rating=g',
            'https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=rofl&limit=50&rating=g',
            'https://api.giphy.com/v1/gifs/search?api_key=dc6zaTOxFJmzC&q=hilarious&limit=50&rating=g'
        ];

        // Source rotation tracking
        let gifSourceIdx = 0;
        let clipSourceIdx = 0;

        // ========== CONTENT STATE ==========
        const state = {
            pic: { used: new Set(), shuffled: [], idx: 0, loading: false, page: 0 },
            gif: { used: new Set(), shuffled: [], idx: 0, loading: false, page: 0 },
            clip: { used: new Set(), shuffled: [], idx: 0, loading: false, page: 0 }
        };

        // ========== TOAST ==========
        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // ========== DOWNLOAD ==========
        function downloadItem(url, name) {
            // Try direct download via anchor
            const ext = url.includes('.gif') ? 'gif' : 'jpg';
            const filename = `laugh_${Date.now()}.${ext}`;

            // Create download link
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';

            // For images that might be blocked, open in new tab
            showToast('📥 Opening image for download...');

            setTimeout(() => {
                window.open(url, '_blank');
            }, 100);
        }

        // ========== CREATE MEME CARD ==========
        function createMemeCard(item) {
            const card = document.createElement('div');
            card.className = 'meme-card';

            card.innerHTML = `
                <div class="meme-media">
                    ${item.type === 'gif' || item.type === 'clip'
                        ? `<img src="${item.url}" alt="${item.name}" loading="lazy" />`
                        : `<img src="${item.url}" alt="${item.name}" loading="lazy" />`
                    }
                </div>
                <div class="meme-info">
                    <div class="meme-title">${item.name}</div>
                    <button class="download-btn" onclick="downloadItem('${item.url}', '${item.name}')">
                        ⬇️ Download
                    </button>
                </div>
            `;

            return card;
        }

        // ========== GET CONTENT FROM SOURCES ==========
        async function getPicContent() {
            let items = [...staticMemes];

            // Try imgflip
            try {
                const resp = await fetch('https://api.imgflip.com/get_memes');
                const data = await resp.json();
                if (data.success) {
                    const newItems = data.data.memes
                        .filter(m => m.url && !m.url.includes('.mp4'))
                        .map(m => ({ url: m.url, name: m.name, type: 'pic' }));
                    items = items.concat(newItems);
                }
            } catch (e) {}

            return items;
        }

        async function getGifContent() {
            let items = [...staticGifs];

            // Cycle through GIPHY sources for unlimited content
            const source = extraGifSources[gifSourceIdx % extraGifSources.length];
            gifSourceIdx++;

            try {
                const resp = await fetch(source);
                const data = await resp.json();
                if (data.data && data.data.length > 0) {
                    const newItems = data.data.map(g => ({
                        url: g.images.fixed_height.url,
                        name: g.title || 'GIF',
                        type: 'gif'
                    }));
                    items = items.concat(newItems);
                }
            } catch (e) {}

            // Try Tenor as backup
            try {
                const resp = await fetch('https://tenor.googleapis.com/v1/trending?key=AIzaSyAyimkuYQYF_FXBOXexdDKA_1bjnYmN0PQ&limit=30');
                const data = await resp.json();
                if (data.results) {
                    const newItems = data.results
                        .filter(r => r.media_formats && r.media_formats.gif)
                        .map(r => ({
                            url: r.media_formats.gif.url,
                            name: r.content_description || 'GIF',
                            type: 'gif'
                        }));
                    items = items.concat(newItems);
                }
            } catch (e) {}

            return items;
        }

        async function getClipContent() {
            let items = [...staticClips];

            // Cycle through GIPHY sources for unlimited content
            const source = extraClipSources[clipSourceIdx % extraClipSources.length];
            clipSourceIdx++;

            try {
                const resp = await fetch(source);
                const data = await resp.json();
                if (data.data && data.data.length > 0) {
                    const newItems = data.data.map(g => ({
                        url: g.images.fixed_height.url,
                        name: g.title || 'Clip',
                        type: 'clip'
                    }));
                    items = items.concat(newItems);
                }
            } catch (e) {}

            // Try Tenor as backup
            try {
                const resp = await fetch('https://tenor.googleapis.com/v1/trending?key=AIzaSyAyimkuYQYF_FXBOXexdDKA_1bjnYmN0PQ&limit=30');
                const data = await resp.json();
                if (data.results) {
                    const newItems = data.results
                        .filter(r => r.media_formats && r.media_formats.gif)
                        .map(r => ({
                            url: r.media_formats.gif.url,
                            name: r.content_description || 'Clip',
                            type: 'clip'
                        }));
                    items = items.concat(newItems);
                }
            } catch (e) {}

            return items;
        }

        // ========== LOAD CONTENT ==========
        async function loadContent(type) {
            if (state[type].loading) return;
            state[type].loading = true;

            const loaderId = type === 'pic' ? 'memesPicLoader' : type === 'gif' ? 'memesGifLoader' : 'memesClipLoader';
            const gridId = type === 'pic' ? 'memesPicGrid' : type === 'gif' ? 'memesGifGrid' : 'memesClipGrid';

            document.getElementById(loaderId).style.display = 'flex';
            document.getElementById(gridId).style.display = 'grid';

            try {
                let allItems;
                if (type === 'pic') allItems = await getPicContent();
                else if (type === 'gif') allItems = await getGifContent();
                else allItems = await getClipContent();

                // Shuffle and filter - show more items per load
                let freshItems = allItems
                    .filter(item => item && item.url && !state[type].used.has(item.url))
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 24); // Load 24 items at a time

                // If no new unique items, reuse from pool
                if (freshItems.length < 10) {
                    state[type].used.clear();
                    freshItems = allItems
                        .filter(item => item && item.url)
                        .sort(() => 0.5 - Math.random())
                        .slice(0, 24);
                }

                freshItems.forEach(item => {
                    state[type].used.add(item.url);
                    const card = createMemeCard(item);
                    document.getElementById(gridId).appendChild(card);
                });

            } catch (e) {
                console.error('Load error:', e);
                showToast('Loading more content...');
            }

            document.getElementById(loaderId).style.display = 'none';
            state[type].loading = false;
            state[type].page++;
        }

        // ========== SECTION SWITCHING ==========
        function showSection(section) {
            document.querySelectorAll('[id$="-section"]').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.controls .btn').forEach(b => b.classList.remove('active'));

            document.getElementById(`${section}-section`).classList.remove('hidden');
            document.querySelector(`.controls .btn:nth-child(${section === 'jokes' ? 1 : section === 'memes-pic' ? 2 : section === 'memes-gif' ? 3 : 4})`).classList.add('active');

            if (section === 'jokes') return;

            const type = section.replace('memes-', '');
            const gridId = `memes${type.charAt(0).toUpperCase() + type.slice(1)}Grid`;

            // Always load fresh content when switching sections
            const grid = document.getElementById(gridId);
            grid.innerHTML = ''; // Clear previous content
            state[type].used.clear(); // Reset used set for fresh items

            loadContent(type);
        }

        // ========== INFINITE SCROLL ==========
        function setupScroll(type, sentinelId) {
            const sentinel = document.getElementById(sentinelId);
            new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    loadContent(type);
                }
            }, { rootMargin: '800px' }).observe(sentinel); // Increased to 800px for earlier loading
        }

        setupScroll('pic', 'memesPicSentinel');
        setupScroll('gif', 'memesGifSentinel');
        setupScroll('clip', 'memesClipSentinel');

        // ========== INIT ==========
        // Pre-load all sections on page load
        window.addEventListener('load', () => {
            setTimeout(() => loadContent('pic'), 500);
            setTimeout(() => loadContent('gif'), 1000);
            setTimeout(() => loadContent('clip'), 1500);
        });

        // ========== JOKES FUNCTIONALITY ==========
        let usedJokeIndices = [];
        let currentJoke = null;

        document.getElementById('newJokeBtn').addEventListener('click', loadNewJoke);

        function loadNewJoke() {
            let available = jokes.map((_, i) => i).filter(i => !usedJokeIndices.includes(i));
            if (available.length === 0) {
                usedJokeIndices = [];
                available = jokes.map((_, i) => i);
            }

            const idx = available[Math.floor(Math.random() * available.length)];
            usedJokeIndices.push(idx);
            currentJoke = jokes[idx];

            const card = document.getElementById('jokeCard');
            card.style.animation = 'none';
            card.offsetHeight;
            card.style.animation = 'fadeIn 0.5s ease';

            document.getElementById('jokeType').textContent = currentJoke.type;
            document.getElementById('joke-setup').textContent = currentJoke.setup;
            document.getElementById('joke-punchline').textContent = currentJoke.punchline;
        }

        function shareJoke() {
            if (currentJoke) {
                const text = `${currentJoke.setup}\n\n${currentJoke.punchline}`;
                if (navigator.share) {
                    navigator.share({ title: '😂 Joke', text });
                } else {
                    navigator.clipboard.writeText(text);
                    showToast('✅ Copied to clipboard!');
                }
            }
        }

        // ========== INIT ==========
        loadNewJoke();
    </script>
